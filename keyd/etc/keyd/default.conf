# Keyd config must begin with [ids]
# [ids] is used to add/exclude devices
[ids]
*

-1d50:615e:0b4aa48d
-1d50:615e:3760fab9
-1d50:615e:c3d84a90

[global]
default_layout = graph
layer_indicator = 1
oneshot_timeout = 700

[main]
capslock = overload(control, esc)
leftalt = leftmeta
rightalt = oneshot(alt)
leftmeta = leftalt
# sysrq = backspace
# esc = sysrq
rightcontrol = backspace
tab = overload(graph_shift, tab)

delete = setlayout(main)
insert = setlayout(graph)

[nav]
space = ,

j = left
k = down
l = up
; = right

y = `
u = A-f
i = macro(8 down)
o = macro(8 up)
p = A-b

, = macro(down down down down)
. = macro(up up up up)
m = >
/ = <


[sym]
capslock = !
q = #
w = [
e = ]
r = |
t = \
a = @
s = (
d = )
f = &
g = *
z = ^
x = {
c = }
v = $
b = ~

y = %
u = 7
i = 8
o = 9
p = .
h = _
j = 4
k = 5
l = 6
; = =
n = ;
m = 1
, = 2
. = 3
/ = 0
' = ?

[graph:layout]
enter = macro(leftshift+space)
space = lettermod(sym, space, 200, 200)
q = b
w = l
e = d
r = w
t = z
y = '
u = f
i = o
o = u
p = j
[ = ;
] = =
a = n
s = r
d = t
f = s
h = y
j = h
k = a
l = e
; = i
' = overload(graph_ctl, enter)
z = q
c = m
v = c
b = v
n = k
m = p
, = -
. = .
- = [
= = ]
# rightshift = overload(graph_shift, oneshot(graph_shift)) 
rightshift = toggle(graph_shift)
leftshift = overload(nav, oneshot(graph_shift)) 
capslock = overload(graph_capslock, esc)
esc = oneshot(graph_shift)

[graph_capslock:C]
space = :

[graph_ctl:C]
# space = comma
capslock = comma

[graph_shift:S]
esc = sysrq
b = V
